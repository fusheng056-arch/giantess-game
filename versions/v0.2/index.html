function resize(){const sw=innerWidth,sh=innerHeight,land=sw>=sh,ar=land?sw/sh:sh/sw;let L=30,Sh=Math.max(12,Math.round(30/ar));
 if(land){VW=L;VH=Sh}else{VH=L;VW=Sh}CW=VW*T;CH=VH*T;C.width=CW;C.height=CH;X.imageSmoothingEnabled=false;
 const k=Math.min(sw/CW,sh/CH);C.style.width=CW*k+'px';C.style.height=CH*k+'px'}

// touch controls
const tk={};const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null;
function joyMove(t){const r=joy.getBoundingClientRect(),dx=t.clientX-r.left-r.width/2,dy=t.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),mx=50,k=d>mx?mx/d:1;
 knob.style.left=(42+dx*k)+'px';knob.style.top=(42+dy*k)+'px';['a','d','w','s'].forEach(q=>keys[q]=0);if(d>14){if(Math.abs(dx)>Math.abs(dy))keys[dx>0?'d':'a']=1;else keys[dy>0?'s':'w']=1}}
joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jid=t.identifier;joyMove(t)},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid)joyMove(t)},{passive:false});
const joyEnd=e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid){jid=null;knob.style.left='42px';knob.style.top='42px';['a','d','w','s'].forEach(q=>keys[q]=0)}};
joy.addEventListener('touchend',joyEnd,{passive:false});joy.addEventListener('touchcancel',joyEnd,{passive:false});
