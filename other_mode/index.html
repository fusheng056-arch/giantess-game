<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>平凡 · 其它模式</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1a1210;color:#f3e6d8;font-family:system-ui,"Noto Sans SC",sans-serif}
.panel{max-width:520px;margin:8vh auto;padding:28px 24px;background:#2a1c18;border:1px solid #5a3a30;border-radius:12px}
h1{margin:0 0 8px;font-size:1.6rem}
h2{margin:0 0 12px;font-size:1.2rem}
.sub,.note{opacity:.75;font-size:.9rem}
.char{margin:12px 0}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
button{appearance:none;border:0;border-radius:8px;padding:12px 16px;font-size:1.05rem;background:#c45c7a;color:#fff;cursor:pointer}
button.ghost{background:transparent;border:1px solid #7a5045;color:#f3e6d8}
button:active{transform:scale(.98)}
dialog{border:1px solid #5a3a30;border-radius:12px;background:#241612;color:#f3e6d8;padding:18px;max-width:420px}
.char-option{display:block;padding:10px;border:1px solid #5a3a30;border-radius:8px;margin:10px 0}
.char-option.selected{border-color:#c45c7a}
.char-form menu{display:flex;gap:8px;padding:0;margin-top:12px}
</style>
</head>
<body>
<main class="panel">
  <h1>其它模式</h1>
  <p class="sub">从开始界面进入 · 试玩版</p>
  <p class="char">当前角色：<strong id="char-name">粉发女主（毛衣 / 短裤 / 赤足）</strong></p>
  <p class="char note">可选用角色：仅此一位。其它模式为赤足试玩；标题页厨房游戏不受影响。</p>
  <div class="actions">
    <button id="btn-start" type="button">开始游戏</button>
    <button id="btn-chars" type="button">更换角色</button>
    <button id="btn-back" type="button" class="ghost">返回开始界面</button>
  </div>
  <dialog id="char-dialog">
    <form method="dialog" class="char-form">
      <h2>更换角色</h2>
      <label class="char-option selected"><input type="radio" name="ch" value="heroine" checked> 粉发女主（毛衣 / 短裤 / 赤足）— 唯一可用</label>
      <p class="note">没有其它已批准角色；不可自造角色。</p>
      <menu>
        <button value="ok">确定</button>
        <button value="cancel" class="ghost">关闭</button>
      </menu>
    </form>
  </dialog>
</main>
<script>
document.getElementById('btn-start').onclick = () => { location.href = 'play.html'; };
document.getElementById('btn-chars').onclick = () => { document.getElementById('char-dialog').showModal(); };
document.getElementById('btn-back').onclick = () => { location.href = '../v0.4/'; };
</script>
</body>
</html>
